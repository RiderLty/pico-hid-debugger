# 持续构建：每次 push 到 main 即编译固件，产物 .uf2 挂在 workflow 的
# Artifacts 里（跑完进 "Artifacts" 下载 pico-hid-debugger-uf2）。
# 手动触发也支持（Actions 页 "Run workflow"）。
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu-latest 自带 cmake（>=3.28，满足 CMakeLists 的 >=3.13），
      # 只缺交叉工具链。libstdc++-arm-none-eabi-newlib 是 SDK 的 C++ 部分
      # （pico_stdlib 链 C++ 运行时）所需，apt 的 gcc-arm-none-eabi 不自带
      - name: 安装 ARM 交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      # SDK 走浅克隆（带子模块：SDK 2.x 的 TinyUSB 在其 lib/ 下），
      # 环境变量指向它，build.sh 会透传给 CMake
      - name: 拉取 Pico SDK
        run: |
          git clone --depth 1 --shallow-submodules --recursive \
            https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> "$GITHUB_ENV"

      # 不带 --update-hidkit：构建绝不提交/推送，纯编译
      - name: 编译固件
        run: ./build.sh

      - name: 上传 .uf2 产物
        uses: actions/upload-artifact@v4
        with:
          name: pico-hid-debugger-uf2
          path: build/src/pico-hid-debugger.uf2
          if-no-files-found: error
