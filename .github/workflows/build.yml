# 构建发版：push **tag**（v*）才构建，构建完自动创建同版本 GitHub Release
# 并把 .uf2 挂为附件；普通的 main 分支 push 不再触发构建。
# workflow_dispatch 保留手动入口（手动跑只出 Artifacts，不发 Release）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 建 Release 需要写 contents 权限（默认 GITHUB_TOKEN 不给）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu-latest 自带 cmake（>=3.28，满足 CMakeLists 的 >=3.13），
      # 只缺交叉工具链。libstdc++-arm-none-eabi-newlib 是 SDK 的 C++ 部分
      # （pico_stdlib 链 C++ 运行时）所需，apt 的 gcc-arm-none-eabi 不自带
      - name: 安装 ARM 交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      # SDK 走浅克隆（带子模块：SDK 2.x 的 TinyUSB 在其 lib/ 下），
      # 环境变量指向它，build.sh 会透传给 CMake
      - name: 拉取 Pico SDK
        run: |
          git clone --depth 1 --shallow-submodules --recursive \
            https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> "$GITHUB_ENV"

      # 不带 --update-hidkit：构建绝不提交/推送，纯编译
      - name: 编译固件
        run: ./build.sh

      - name: 上传 .uf2 产物
        uses: actions/upload-artifact@v4
        with:
          name: pico-hid-debugger-uf2
          path: build/src/pico-hid-debugger.uf2
          if-no-files-found: error

      # 仅 tag 触发时发版：tag 指向的 commit 就是刚构建的 commit。
      # Release 已存在（手工建过）则只补传附件并覆盖旧版
      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" build/src/pico-hid-debugger.uf2 \
            --title "$TAG" --generate-notes \
            || gh release upload "$TAG" build/src/pico-hid-debugger.uf2 --clobber
