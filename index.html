<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pico-hid-debugger 日志查看器</title>
<link rel="stylesheet" href="vendor/xterm.min.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0d1117; color: #c9d1d9;
    font-family: system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: #161b22; border-bottom: 1px solid #30363d;
  }
  header .title { font-weight: 600; margin-right: 4px; }
  button, select {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #30363d; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #238636; border-color: #2ea043; color: #fff; }
  button.primary:hover:not(:disabled) { background: #2ea043; }
  /* 定宽 + 居中：状态文字长度变化（连接中…↔重连中…）不引起顶栏重排 */
  #status {
    font-size: 12px; padding: 3px 10px; border-radius: 10px; background: #30363d;
    min-width: 14em; text-align: center; white-space: nowrap;
  }
  #status.ok   { background: #12351c; color: #7ee787; }
  #status.bad  { background: #43202a; color: #ffa198; }
  #status.wait { background: #3a2d12; color: #e3b341; }
  #btnConnect { min-width: 6em; }
  #btnExport { margin-left: auto; }
  #count { font-size: 12px; color: #8b949e; }
  /* 固件输出开关：一个字节下发，每一位控一类输出（位表见固件 src/log_switch.h） */
  .swgroup {
    display: flex; align-items: center; gap: 8px; padding: 3px 10px;
    border: 1px solid #30363d; border-radius: 6px; background: #0d1117; font-size: 12px;
  }
  .swgroup > .lbl { color: #8b949e; }
  .swgroup label { display: flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
  .swgroup input { accent-color: #238636; margin: 0; cursor: pointer; }
  /* 关掉的置灰。:has() 不可用时只是少了灰化，不影响功能 */
  .swgroup label:has(input:not(:checked)) { color: #6e7681; }
  .regexbox { position: relative; display: flex; align-items: center; gap: 4px; }
  #regex {
    background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 4px 8px; font-size: 13px; width: 190px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #regex:focus { outline: none; border-color: #1f6feb; }
  #regex.invalid { border-color: #f85149; background: #3d1418; }
  #btnRegexHist { padding: 4px 8px; }
  #regexMenu {
    position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 30;
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    min-width: 240px; max-width: 340px; max-height: 280px; overflow-y: auto;
    box-shadow: 0 4px 14px rgba(0,0,0,.55);
  }
  #regexMenu .rm-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; }
  #regexMenu .rm-row:hover { background: #21262d; }
  #regexMenu .rm-pat { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  #regexMenu .rm-del {
    background: none; border: none; color: #f85149;
    padding: 0 4px; font-size: 13px; cursor: pointer;
  }
  #regexMenu .rm-clear {
    color: #8b949e; font-size: 12px; border: none; background: none;
    padding: 6px 8px; width: 100%; text-align: left; cursor: pointer;
  }
  #regexMenu .rm-clear:hover { color: #ffa198; }
  #regexMenu .rm-empty { color: #8b949e; font-size: 12px; padding: 6px 8px; }
  #logwrap { position: relative; flex: 1; min-height: 0; }
  #term { position: absolute; inset: 0; }
  #hint { padding: 4px 12px 10px; color: #e3b341; font-size: 13px; }
  #bottomChip {
    position: absolute; right: 16px; bottom: 14px; display: none;
    background: #1f6feb; color: #fff; border: none; border-radius: 14px;
    padding: 5px 14px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  /* xterm 视口滚动条细化 */
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <span class="title">pico-hid-debugger</span>
  <span id="status">未连接</span>
  <button id="btnConnect" class="primary">连接串口</button>
  <button id="btnPick" title="重新弹出系统串口选择框">选择设备…</button>
  <select id="baud" title="波特率（须与固件一致，重连后生效）">
    <option value="2000000" selected>2M</option>
    <option value="921600">921600</option>
    <option value="1000000">1M</option>
    <option value="3000000">3M</option>
  </select>
  <!-- 固件输出开关：下发一个字节，每一位控一类输出（位表见固件 src/log_switch.h）。
       选择记忆在本机，连接一打开就立即下发；不接固件时点击只会报错到控制台 -->
  <span class="swgroup" id="swgroup"
        title="固件输出开关（经串口下发，立即生效）。选择记忆在本机，每次连接打开时自动重发">
    <span class="lbl">输出</span>
    <label title="[HIDKIT] 语义事件行：键 / 鼠标位移 / 手柄状态"><input type="checkbox" data-sw="0">HIDKIT</label>
    <label title="[HKDBG] hidkit 库内诊断：为什么没认出某个设备看这里"><input type="checkbox" data-sw="1">HKDBG</label>
    <label title="[TUSB] TinyUSB 栈日志：枚举与传输细节，量大"><input type="checkbox" data-sw="2">TUSB</label>
    <label title="[HID] 原始报文 hexdump：设备原始行为，量大"><input type="checkbox" data-sw="3">HID</label>
    <label title="挂载与描述符 dump：[MOUNT]/[DEVDS]/[CFGDS]/[STRDS]/[HIDMT]/[RPTDS]…"><input type="checkbox" data-sw="4">INFO</label>
  </span>
  <select id="filter" title="日志过滤">
    <option value="all">全部日志</option>
    <option value="tusb">仅 [TUSB]</option>
    <option value="no-tusb">排除 [TUSB]</option>
  </select>
  <div class="regexbox">
    <input id="regex" type="text" spellcheck="false"
           placeholder="正则过滤（可留空）" autocomplete="off"
           title="正则匹配整行内容（忽略大小写），与左侧过滤叠加；回车记忆，▾ 管理历史">
    <button id="btnRegexHist" title="历史正则：应用 / 删除">▾</button>
    <div id="regexMenu" style="display:none"></div>
  </div>
  <button id="btnExport" title="导出当前过滤视图为 .log 文件">导出 .log</button>
  <button id="btnClear" title="清空当前日志显示与内存缓冲">清空日志</button>
  <span id="count">0 行</span>
</header>
<div id="hint" style="display:none"></div>
<div id="logwrap">
  <div id="term"></div>
  <button id="bottomChip">↓ 回到底部</button>
</div>

<script src="vendor/xterm.min.js"></script>
<script src="vendor/addon-webgl.min.js"></script>
<script src="vendor/addon-fit.min.js"></script>
<script>
'use strict';
const MAX_LINES = 50000;        // 内存模型与 xterm 回滚上限
const KEY_PORT = 'pico-hid-debugger.portKey';
const KEY_BAUD = 'pico-hid-debugger.baud';
const KEY_SW = 'pico-hid-debugger.switch';
// 固件输出开关的位表，**须与固件 src/log_switch.h 一致**：
// bit0 HIDKIT / bit1 HKDBG / bit2 TUSB / bit3 HID / bit4 INFO，bit5-7 保留。
// 默认 0x13 = 语义层 + 挂载信息（[TUSB]/[HID] 要显式打开）
const SW_DEFAULT = 0x13, SW_MASK = 0x1F;

const $ = id => document.getElementById(id);
const termEl = $('term'), statusEl = $('status'), countEl = $('count');
const btnConnect = $('btnConnect'), btnPick = $('btnPick'), btnClear = $('btnClear');
const btnExport = $('btnExport'), filterSel = $('filter'), baudSel = $('baud');
const chip = $('bottomChip'), hintEl = $('hint');

let port = null;                // 当前使用的 SerialPort
let portKey = '';               // "vid:pid" 标识，localStorage 记忆
let running = false;            // 读循环是否活跃
let opening = false;            // openPort 并发防护（事件与看门狗可能同时触发）
let wantConnected = false;      // 是否期望保持连接（手动断开后关闭自动重连）
let baud = 2000000;
let currentReader = null;
let lineBuf = '';               // 跨 read() 的半行缓冲
let allLines = [];              // 全量模型：[{cls, text}]，导出与过滤切换的数据源
let viewLines = [];             // 当前过滤视图
let pending = [];               // 待 rAF 批量写入 xterm 的 ANSI 行
let writeScheduled = false;
let atBottom = true;            // xterm 视口是否贴底（贴底时自动跟随输出）
let missCount = 0;              // 离开底部期间新到的行数
let regexObj = null;            // 生效中的正则（null = 不过滤）
let regexTimer = 0;             // 输入防抖定时器
let nextRetryAt = 0;            // 下次允许重试连接的时间戳（失败退避）
const KEY_REGEX = 'pico-hid-debugger.regex';
const KEY_REGEX_HIST = 'pico-hid-debugger.regexHist';

// ---------------------------------------------------------------- 环境检查
if (!('serial' in navigator)) {
  hintEl.style.display = 'block';
  hintEl.textContent = '此浏览器不支持 Web Serial API：请使用 Chrome / Edge（89+），'
    + '并通过 https 或 http://localhost 打开本页（file:// 打开若不可用，'
    + '可在工程目录运行 python3 -m http.server 后访问 http://localhost:8000/）。';
  btnConnect.disabled = btnPick.disabled = true;
}
if (typeof Terminal === 'undefined') {
  hintEl.style.display = 'block';
  hintEl.textContent = 'vendor/ 下的 xterm 库文件缺失，请重新检出仓库。';
}

// ---------------------------------------------------------------- xterm
let term = null, fitAddon = null;

function initTerm() {
  try {
    term = new Terminal({
      scrollback: MAX_LINES,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      fontSize: 12,
      lineHeight: 1.2,
      cursorBlink: false,
      cursorInactiveStyle: 'none',
      convertEol: false,
      theme: {
        background: '#0d1117', foreground: '#c9d1d9',
        cursor: 'transparent', selectionBackground: '#264f78',
      },
    });
    // 三个库的 UMD 挂载方式不同：xterm 展开挂载（window.Terminal 即类），
    // fit/webgl 为命名空间对象（window.FitAddon.FitAddon 才是类），做兼容
    fitAddon = new (typeof FitAddon === 'function' ? FitAddon : FitAddon.FitAddon)();
    term.open(termEl);
    term.loadAddon(fitAddon);
    fitAddon.fit();
  } catch (err) {
    hintEl.style.display = 'block';
    hintEl.textContent = '终端初始化失败: ' + (err && err.message || err);
    return;
  }

  // WebGL 渲染器（GPU 加速）延迟异步加载：页面先以 DOM 渲染器立即可用。
  // WebGL 上下文创建在受限 GPU 环境可能长时间挂起，不能放在初始化关键路径上。
  // 失败或上下文丢失时自动回退 DOM 渲染。?renderer=dom 可强制禁用 WebGL。
  setTimeout(() => {
    try {
      if (new URLSearchParams(location.search).get('renderer') === 'dom') return;
      const probe = document.createElement('canvas');
      if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) return;
      const WACtor = typeof WebglAddon === 'function' ? WebglAddon : WebglAddon.WebglAddon;
      const gl = new WACtor();
      gl.onContextLoss(() => { try { gl.dispose(); } catch {} });
      term.loadAddon(gl);
    } catch { /* WebGL 不可用：继续用默认渲染器 */ }
  }, 200);

  // xterm 语义：视口贴底时新输出自动跟随；用户上滚后输出不再拖动视口。
  // 这里只负责检测"是否贴底"，驱动回到底部角标
  const vp = termEl.querySelector('.xterm-viewport');
  if (vp) {
    vp.addEventListener('scroll', () => {
      const b = term.buffer.active;
      const bottom = b.viewportY + term.rows >= b.length;
      if (bottom && !atBottom) { atBottom = true; missCount = 0; chip.style.display = 'none'; }
      else if (!bottom && atBottom) { atBottom = false; chip.style.display = 'block'; }
    });
  }
  new ResizeObserver(() => { try { fitAddon.fit(); } catch {} }).observe($('logwrap'));
}

// 行分类 → ANSI 着色（xterm 无 CSS 类，用 SGR 序列）
function classify(text) {
  if (text.startsWith('[TUSB]'))  return 't-tusb';
  if (text.startsWith('[BOOT]'))  return 't-mount';
  if (text.startsWith('[CTRL]'))  return 't-ctrl';
  if (text.startsWith('[ERROR]') || text.startsWith('[DROP]')) return 't-err';
  if (text.startsWith('[MOUNT]') || text.startsWith('[DEVRM]') ||
      text.startsWith('[HIDMT]') || text.startsWith('[UNHID]'))  return 't-mount';
  if (text.startsWith('[HID]') || text.startsWith('[HID+]'))   return 't-hid';
  return '';
}
function ansiWrap(cls, text) {
  switch (cls) {
    case 't-tusb':  return '\x1b[90m' + text + '\x1b[0m';
    case 't-hid':   return '\x1b[36m' + text + '\x1b[0m';
    case 't-mount': return '\x1b[32m' + text + '\x1b[0m';
    case 't-ctrl':  return '\x1b[35m' + text + '\x1b[0m';
    case 't-err':   return '\x1b[91m' + text + '\x1b[0m';
    default:        return text;
  }
}
const passFilter = (cls, text) => {
  // 左侧 TAG 过滤 + 正则内容过滤，两者叠加（与）
  if (filterSel.value === 'tusb' && cls !== 't-tusb') return false;
  if (filterSel.value === 'no-tusb' && cls === 't-tusb') return false;
  return !regexObj || regexObj.test(text);
};

// ---------------------------------------------------------------- 输出
function scheduleFlush() {
  if (writeScheduled) return;
  writeScheduled = true;
  requestAnimationFrame(() => {
    writeScheduled = false;
    if (term && pending.length) {
      term.write(pending.join('\r\n') + '\r\n');
      pending = [];
    }
    if (!atBottom) chip.textContent = '↓ 回到底部（+' + missCount + '）';
    countEl.textContent = viewLines.length + ' 行';
  });
}

function appendLine(text) {
  // 固件重启的标志行（刷固件 / 复位）：串口没断就不会触发自动重连，固件却已
  // 回到默认开关值 —— 这里补一次下发，把记忆的开关重新压回去
  if (text.startsWith('[BOOT]')) sendSwitch();

  const cls = classify(text);
  allLines.push({ cls, text });
  if (passFilter(cls, text)) {
    pending.push(ansiWrap(cls, text));
    viewLines.push(allLines[allLines.length - 1]);   // 导出/过滤切换的数据源
  }
  if (!atBottom) missCount++;
  // 超上限时批量截断模型头部（逐条 shift 为 O(n)，高频下代价大）；
  // xterm 自身回滚由 scrollback 配置独立管理
  if (allLines.length > MAX_LINES + 2000)
    allLines.splice(0, allLines.length - MAX_LINES);
  if (viewLines.length > MAX_LINES + 2000)
    viewLines.splice(0, viewLines.length - MAX_LINES);
  scheduleFlush();
}

// 过滤切换 / 清空后重写终端内容
function rebuildTerm(lines) {
  term.reset();
  atBottom = true; missCount = 0; chip.style.display = 'none';
  if (lines.length) term.write(lines.map(l => ansiWrap(l.cls, l.text)).join('\r\n') + '\r\n');
  countEl.textContent = lines.length + ' 行';
}

// ---------------------------------------------------------------- 正则过滤
// 输入实时应用（400ms 防抖）；回车/失焦时记忆进历史；▾ 菜单与输入聚焦时
// 显示按当前输入过滤的历史候选（自定义补全，不依赖 datalist——浏览器自身的
// 表单历史下拉无法关闭，故用随机 name 断开其记忆关联，见 initRegexInput）。
// 历史与当前值均存 localStorage，刷新页面自动恢复。
const regexInput = $('regex'), regexMenu = $('regexMenu');

function getRegexHist() {
  try { const h = JSON.parse(localStorage.getItem(KEY_REGEX_HIST) || '[]'); return Array.isArray(h) ? h : []; }
  catch { return []; }
}
function setRegexHist(h) {
  localStorage.setItem(KEY_REGEX_HIST, JSON.stringify(h.slice(0, 20)));
}
function recordRegex(p) {
  if (!p) return;
  const h = getRegexHist().filter(x => x !== p);
  h.unshift(p);
  setRegexHist(h);
}

// 应用正则。无效表达式：红框提示并保持上一次的有效过滤不变
function applyRegex(src) {
  localStorage.setItem(KEY_REGEX, src);
  if (!src) {
    regexInput.classList.remove('invalid');
    regexObj = null;
    rebuildViewData();
    rebuildTerm(viewLines);
    return;
  }
  let obj;
  try { obj = new RegExp(src, 'i'); }
  catch { regexInput.classList.add('invalid'); return; }
  regexInput.classList.remove('invalid');
  regexObj = obj;
  rebuildViewData();
  rebuildTerm(viewLines);
}

function rebuildViewData() {
  viewLines = allLines.filter(l => passFilter(l.cls, l.text));
}

// 历史菜单：既是 ▾ 按钮的管理面板，也是输入时的补全下拉。
// 候选按当前输入内容过滤（子串匹配，忽略大小写）
function renderRegexMenu() {
  const q = regexInput.value.trim().toLowerCase();
  const h = getRegexHist().filter(p => !q || p.toLowerCase().includes(q));
  regexMenu.innerHTML = '';
  if (!h.length) {
    const d = document.createElement('div');
    d.className = 'rm-empty';
    d.textContent = q ? '无匹配的历史正则' : '暂无历史正则（输入后回车即记忆）';
    regexMenu.appendChild(d);
    return;
  }
  for (const p of h) {
    const row = document.createElement('div');
    row.className = 'rm-row';
    const pat = document.createElement('span');
    pat.className = 'rm-pat';
    pat.textContent = p;
    pat.title = '点击应用';
    // mousedown 阻止默认，避免输入框先失焦导致菜单在 click 前关闭
    pat.addEventListener('mousedown', e => e.preventDefault());
    pat.addEventListener('click', () => {
      regexInput.value = p;
      applyRegex(p);
      recordRegex(p);
      hideRegexMenu();
    });
    const del = document.createElement('button');
    del.className = 'rm-del';
    del.textContent = '✕';
    del.title = '从历史中删除';
    del.addEventListener('mousedown', e => e.preventDefault());
    del.addEventListener('click', ev => {
      ev.stopPropagation();
      setRegexHist(getRegexHist().filter(x => x !== p));
      renderRegexMenu();
    });
    row.append(pat, del);
    regexMenu.appendChild(row);
  }
  const clear = document.createElement('button');
  clear.className = 'rm-clear';
  clear.textContent = '清空历史';
  clear.addEventListener('mousedown', e => e.preventDefault());
  clear.addEventListener('click', () => { setRegexHist([]); renderRegexMenu(); });
  regexMenu.appendChild(clear);
}

function showRegexMenu() { renderRegexMenu(); regexMenu.style.display = 'block'; }
function hideRegexMenu() { regexMenu.style.display = 'none'; }
let atMenuOpen = false;   // 聚焦/输入过程中补全菜单处于打开状态

// 随机 name：Chrome 的表单历史按 (站点, 字段 name/id) 记忆，每次加载
// 生成不同的 name 可使其永远查不到旧记录，从而只保留自定义补全
regexInput.setAttribute('name', 'regex_' + Math.random().toString(36).slice(2));

regexInput.addEventListener('input', () => {
  clearTimeout(regexTimer);
  regexTimer = setTimeout(() => applyRegex(regexInput.value.trim()), 400);
  if (atMenuOpen) showRegexMenu();       // 输入过程中刷新补全候选
});
regexInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(regexTimer);
    const v = regexInput.value.trim();
    applyRegex(v);
    recordRegex(v);
    hideRegexMenu();
  } else if (e.key === 'Escape') {
    hideRegexMenu();
  }
});
regexInput.addEventListener('focus', () => { atMenuOpen = true; showRegexMenu(); });
regexInput.addEventListener('blur', () => {
  atMenuOpen = false;
  recordRegex(regexInput.value.trim());
  setTimeout(hideRegexMenu, 120);        // 略延迟，让菜单行的 click 先落地
});
$('btnRegexHist').addEventListener('click', e => {
  e.stopPropagation();
  const show = regexMenu.style.display !== 'block';
  if (show) showRegexMenu(); else hideRegexMenu();
});
document.addEventListener('click', e => {
  if (!regexMenu.contains(e.target) && e.target !== regexInput) hideRegexMenu();
});

// ---------------------------------------------------------------- 字节流 → 行
function handleBytes(value) {
  lineBuf += new TextDecoder().decode(value, { stream: true });
  let nl;
  while ((nl = lineBuf.indexOf('\n')) >= 0) {
    const line = lineBuf.slice(0, nl).replace(/\r$/, '');
    lineBuf = lineBuf.slice(nl + 1);
    appendLine(line);
  }
  // 防御：无换行的异常超长堆积时截断
  if (lineBuf.length > 4096) { appendLine(lineBuf); lineBuf = ''; }
}

// ---------------------------------------------------------------- 固件输出开关
// 勾选框是**唯一事实源**：只有它会写，不拿 [CTRL]/[BOOT] 回显去反同步 UI ——
// 少一层来回，行为可预期。位号写在 DOM 的 data-sw 上，位表不两处硬编码。
const swBoxes = [...document.querySelectorAll('#swgroup input[data-sw]')];
let swMask = SW_DEFAULT;

function renderSw() {
  for (const b of swBoxes) b.checked = (swMask & (1 << +b.dataset.sw)) !== 0;
}
const swFromUI = () => swBoxes.reduce((m, b) => b.checked ? m | (1 << +b.dataset.sw) : m, 0);

// 下发必须串行化：连续两次 change 会同时走到 writable.getWriter()，第二次抛
// "WritableStream is locked"。用一条 promise 链排队，每次调用捕获当时的掩码，
// 保证最终落到固件的一定是最新值；异常一律吞掉（端口竞态/已关闭），
// **绝不能冒泡打断 openPort() 的连接流程**。
let swChain = Promise.resolve();
function sendSwitch() {
  const mask = swMask;
  swChain = swChain.then(async () => {
    const p = port;
    if (!p || !p.writable) return;          // 断开后 writable 为 null
    const w = p.writable.getWriter();
    try { await w.write(new Uint8Array([mask])); }
    finally { w.releaseLock(); }
  }).catch(() => { /* 下次连接打开时会重发 */ });
  return swChain;
}

swBoxes.forEach(b => b.addEventListener('change', () => {
  swMask = swFromUI();                      // 只用有效位（见 swFromUI）
  localStorage.setItem(KEY_SW, String(swMask));
  sendSwitch();
}));

// ---------------------------------------------------------------- 串口
async function readLoop(p) {
  running = true;
  lineBuf = '';
  setStatus('已连接 ' + keyOf(p) + ' @ ' + baud, 'ok');
  btnConnect.textContent = '断开';

  while (running && p.readable) {
    const reader = p.readable.getReader();
    currentReader = reader;
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (value) handleBytes(value);
        if (done) break;
      }
    } catch { /* 设备拔出等：流报错，落到下方收尾 */ }
    finally {
      try { reader.releaseLock(); } catch {}
      if (currentReader === reader) currentReader = null;
    }
    if (running && p.readable) continue;   // EOF 但口还在：重挂 reader
    break;
  }

  running = false;
  if (port === p) {
    if (lineBuf) { appendLine(lineBuf); lineBuf = ''; }  // 残行收尾
    if (wantConnected) setStatus('已断开 · 等待重连…', 'wait');
    else { setStatus('未连接'); btnConnect.textContent = '连接串口'; }
  }
}

async function openPort(p) {
  if (running || opening) return;
  opening = true;
  port = p;
  portKey = keyOf(p);
  localStorage.setItem(KEY_PORT, portKey);
  wantConnected = true;                 // 先置位：失败后由看门狗按退避节奏重试
  btnConnect.textContent = '断开';       // 重连等待期点击 = 停止自动重连
  setStatus('连接中…', 'wait');

  // 单次尝试，不在内部循环重试：设备重插后 SerialPort 是新对象，
  // 循环重试旧对象必然失败还会吞掉 connect 快速通道；
  // 失败交给看门狗（100ms tick + 1s 退避）重新 getPorts 解析最新设备
  try {
    await p.open({ baudRate: baud });
  } catch (err) {
    nextRetryAt = Date.now() + 1000;
    opening = false;
    setStatus('重连中…（1s 后自动重试）', 'wait');
    return;
  }

  // 打开期间用户点了断开：丢弃本次连接
  if (!wantConnected) {
    try { await p.close(); } catch {}
    opening = false;
    setStatus('未连接');
    btnConnect.textContent = '连接串口';
    return;
  }
  nextRetryAt = 0;
  opening = false;
  readLoop(p);
  // 连接一打开就把记忆的开关压下去 —— 固件上电只有默认值，不等用户点。
  // 排在 readLoop 之后，保证固件回的 [CTRL] 能被读到
  sendSwitch();
}

async function closePort() {
  wantConnected = false;
  running = false;
  nextRetryAt = 0;
  try { if (currentReader) await currentReader.cancel(); } catch {}
  try { if (port) await port.close(); } catch {}
  setStatus('未连接');
  btnConnect.textContent = '连接串口';
}

// ---------------------------------------------------------------- 工具
const sleep = ms => new Promise(r => setTimeout(r, ms));
const keyOf = p => { try { const i = p.getInfo();
  return (i.usbVendorId || 0).toString(16) + ':' + (i.usbProductId || 0).toString(16);
} catch { return '?'; } };

function setStatus(text, cls) {
  const c = cls || '';
  if (statusEl.textContent === text && statusEl.className === c) return;  // 去重，避免无谓重排
  statusEl.textContent = text;
  statusEl.className = c;
}

// ---------------------------------------------------------------- 串口事件
// 连接按钮：优先连已授权且匹配记忆标识的设备（免手势），否则弹选择框。
// 重连等待中（opening）点击 = 停止自动重连
btnConnect.addEventListener('click', async () => {
  if (running || opening) { closePort(); return; }
  const ports = await navigator.serial.getPorts();
  const target = ports.find(p => keyOf(p) === portKey) || port || ports[0];
  if (target) { openPort(target); return; }
  pickPort();
});

// 选择设备：总是弹系统选择框（需要用户手势）
btnPick.addEventListener('click', pickPort);
async function pickPort() {
  try {
    const p = await navigator.serial.requestPort();
    port = null;
    openPort(p);
  } catch { /* 用户取消 */ }
}

// 断开/重连：快速通道走 connect 事件，兜底走 100ms 看门狗轮询
// （授权持久化：requestPort 一次即可，重连全程无需用户手势）
navigator.serial?.addEventListener('disconnect', e => {
  if (e.port !== port) return;
  running = false;                       // 读循环随即报错退出
  if (wantConnected) setStatus('已断开 · 等待重连…', 'wait');
});

navigator.serial?.addEventListener('connect', e => {
  nextRetryAt = 0;                       // 设备出现：清退避，立即抢连
  if (running || opening || !wantConnected) return;
  if (portKey && keyOf(e.port) !== portKey) return;
  openPort(e.port);
});

setInterval(async () => {
  if (running || opening || !wantConnected) return;
  if (Date.now() < nextRetryAt) return;  // 失败退避期内不再尝试
  try {
    const ports = await navigator.serial.getPorts();
    const target = ports.find(p => keyOf(p) === portKey) ||
                   (ports.length === 1 ? ports[0] : null);
    if (target) openPort(target);
  } catch { /* getPorts 失败下轮再试 */ }
}, 100);

// ---------------------------------------------------------------- 交互
filterSel.addEventListener('change', () => {
  rebuildViewData();
  rebuildTerm(viewLines);
});

btnClear.addEventListener('click', () => {
  allLines = []; viewLines = []; lineBuf = '';
  rebuildTerm([]);
});

// 导出当前过滤视图为 .log（\r\n 行尾，与固件输出一致），文件名含过滤模式
btnExport.addEventListener('click', () => {
  if (!viewLines.length) return;
  const text = viewLines.map(l => l.text).join('\r\n') + '\r\n';
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  a.href = url;
  a.download = 'hid-debugger-' + filterSel.value + '-' +
    d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' +
    pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.log';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

chip.addEventListener('click', () => {
  term.scrollToBottom();
  atBottom = true; missCount = 0;
  chip.style.display = 'none';
});

baudSel.addEventListener('change', () => {
  baud = +baudSel.value;
  localStorage.setItem(KEY_BAUD, baud);
});

// 调试探子（控制台可用：__debug.append('[HID] dev=2 ...') 验证渲染）
window.__debug = { append: appendLine, term: () => term };

// ---------------------------------------------------------------- 启动
(async () => {
  if (typeof Terminal !== 'undefined') initTerm();
  // 恢复上次的固件输出开关（先于下面的环境检查：不支持 Web Serial 时
  // 勾选框也应如实显示记忆的状态，而不是一片未选）。存储值可能被手改坏：
  // 非法就回落默认，并只取有效位
  const savedSw = parseInt(localStorage.getItem(KEY_SW) ?? '', 10);
  swMask = (Number.isFinite(savedSw) ? savedSw : SW_DEFAULT) & SW_MASK;
  renderSw();
  if (!('serial' in navigator)) return;
  baud = +(localStorage.getItem(KEY_BAUD) || 2000000);
  baudSel.value = String(baud);
  portKey = localStorage.getItem(KEY_PORT) || '';
  // 恢复上次的正则过滤（不重复记忆）
  regexInput.value = localStorage.getItem(KEY_REGEX) || '';
  if (regexInput.value) applyRegex(regexInput.value);
  // 页面加载即恢复连接：已授权端口不需要任何用户手势
  const ports = await navigator.serial.getPorts();
  if (!ports.length) return;
  const target = ports.find(p => keyOf(p) === portKey) || (ports.length === 1 ? ports[0] : null);
  if (target) openPort(target);
})();
</script>
</body>
